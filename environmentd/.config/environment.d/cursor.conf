# Cursor env for the entire session, including the compositor itself.
# Hyprland's `env = XCURSOR_SIZE,…` only reaches child processes; the
# compositor (launched via uwsm) needs these at session-start via
# environment.d, or its native cursor can default to a wrong size.
XCURSOR_SIZE=24
HYPRCURSOR_SIZE=24
XCURSOR_THEME=catppuccin-mocha-dark-cursors
HYPRCURSOR_THEME=catppuccin-mocha-dark-cursors
