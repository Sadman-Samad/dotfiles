# Prepend user bin dirs to PATH for the whole Plasma/systemd session.
# GUI app launches (.desktop Exec with bare command names) inherit this —
# fixes "command not found" from the application menu. Read by systemd at
# session start; re-login (or `systemctl --user import-environment PATH`)
# to apply.
PATH=%h/.local/bin:%h/.local/script:%h/.bun/bin:/opt/flutter/bin:%h/android-sdk/platform-tools:%h/android-sdk/cmdline-tools/latest/bin:%h/android-sdk/jdk-17.0.13+11/bin
